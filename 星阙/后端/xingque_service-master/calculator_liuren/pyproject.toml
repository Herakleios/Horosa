[tool.poetry]
name = "star-calculator"
version = "0.1.0"
description = "星算者"
authors = ["海岸边的诗人 <seaboet.coraft@gmail.com>"]
readme = "README.md"

# 指定包的路径
packages = [
    { include = "constant", from = "src" },
    { include = "tools", from = "src" },
    { include = "units", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"
pytest = "^8.3.3"
skyfield = "^1.49"
lunar-python = "^1.3.10"
rich = "^13.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
